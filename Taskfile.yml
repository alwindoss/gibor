# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  APP_NAME: gibor
  DOCKER_REPOSITORY_OWNER: alwindoss
  VERSION: 0.0.1

tasks:
  dev:
    desc: Run the Go backend (via Air) and UI dev server in parallel
    deps:
      - dev:backend
      - dev:ui

  dev:backend:
    desc: Watch and rebuild the Go binary
    cmds:
      - go tool air

  dev:ui:
    desc: Run the frontend development server
    cmds:
      - npm --prefix ui run dev

  build:
    desc: Run the build for frontend and then the backend
    cmds:
      - task: build:frontend
      - task: build:backend
  build:backend:
    desc: Run the build for the backend
    cmds:
      - CGO_ENABLED=0 go build -o ./bin/gibor ./cmd/{{.APP_NAME}}
  build:frontend:
    desc: Run the build for the frontend
    cmds:
      - npm --prefix ui install
      - npm --prefix ui run build

  build:docker:
    desc: Create a docker build
    cmds:
      - docker build -t {{.DOCKER_REPOSITORY_OWNER}}/{{.APP_NAME}}:{{.VERSION}} .

  publish:docker:
    desc: Publish the current version to docker registry
    cmds:
      - docker push {{.DOCKER_REPOSITORY_OWNER}}/{{.APP_NAME}}:{{.VERSION}}
  
  clean:
    desc: Run the clean for frontend and then the backend
    cmds:
      - task: clean:frontend
      - task: clean:backend
  clean:backend:
    desc: Run the clean for the backend
    cmds:
      - rm -rf bin
  clean:frontend:
    desc: Run the clean for the frontend
    cmds:
      - rm -rf ui/dist

  

  